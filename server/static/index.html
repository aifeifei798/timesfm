<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimesFM 预测控制台</title>
<script src="/static/vendor/tailwind.js"></script>
<script src="/static/vendor/echarts.min.js"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: { sans: ["Inter", "system-ui", "PingFang SC", "Microsoft YaHei", "sans-serif"] },
        boxShadow: { glow: "0 0 40px -10px rgba(99,102,241,0.45)" },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  .tab-active { @apply bg-indigo-500/15 text-indigo-300 border-indigo-500/40; }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 antialiased selection:bg-indigo-500/30">

<!-- 背景装饰光晕 -->
<div class="pointer-events-none fixed inset-0 overflow-hidden">
  <div class="absolute -top-40 left-1/4 h-96 w-96 rounded-full bg-indigo-600/10 blur-3xl"></div>
  <div class="absolute top-1/2 -right-32 h-96 w-96 rounded-full bg-emerald-500/5 blur-3xl"></div>
</div>

<!-- 顶栏 -->
<header class="sticky top-0 z-20 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3.5">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-glow">
        <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M14 7h7v7"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-semibold tracking-wide text-white">TimesFM 预测控制台</h1>
        <p class="text-xs text-slate-500">Google TimesFM 3.0 · 零样本时间序列预测</p>
      </div>
    </div>
    <div id="health-badge" class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/60 px-3.5 py-1.5 text-xs">
      <span id="health-dot" class="h-2 w-2 animate-pulse rounded-full bg-slate-500"></span>
      <span id="health-text" class="text-slate-400">检测中...</span>
    </div>
  </div>
</header>

<main class="relative mx-auto max-w-7xl px-6 py-8">
  <div class="grid gap-6 lg:grid-cols-[380px_1fr]">

    <!-- 左侧:输入面板 -->
    <section class="space-y-6">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 backdrop-blur">
        <!-- Tab 切换 -->
        <div class="mb-5 grid grid-cols-2 gap-1 rounded-xl border border-slate-800 bg-slate-950/60 p-1">
          <button id="tab-univariate" onclick="switchTab('univariate')"
            class="tab-active rounded-lg border border-transparent px-3 py-2 text-sm font-medium transition">单序列预测</button>
          <button id="tab-multivariate" onclick="switchTab('multivariate')"
            class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium text-slate-400 transition hover:text-slate-200">多变量预测</button>
        </div>

        <!-- 单序列表单 -->
        <div id="panel-univariate" class="space-y-4">
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label class="text-sm font-medium text-slate-300">历史序列数据</label>
              <button onclick="fillSample()" class="text-xs text-indigo-400 transition hover:text-indigo-300">✨ 生成示例数据</button>
            </div>
            <textarea id="input-series" rows="8" spellcheck="false"
              placeholder="每行一条序列,数值用逗号/空格分隔&#10;例如:&#10;1.2, 3.4, 5.6, ...&#10;10, 9.5, 9.8, 10.2, ..."
              class="w-full resize-y rounded-xl border border-slate-800 bg-slate-950/80 p-3 font-mono text-xs leading-5 text-slate-300 placeholder:text-slate-600 focus:border-indigo-500/60 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
            <p class="mt-1.5 text-xs text-slate-500">每行一条独立序列,批量并行预测;上下文最长 15360 点</p>
          </div>
        </div>

        <!-- 多变量表单 -->
        <div id="panel-multivariate" class="hidden space-y-4">
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label class="mb-0 block text-sm font-medium text-slate-300">目标变量矩阵</label>
              <button onclick="fillSample()" class="text-xs text-indigo-400 transition hover:text-indigo-300">✨ 生成示例数据</button>
            </div>
            <textarea id="input-targets" rows="6" spellcheck="false"
              placeholder="每行一个变量,各变量长度一致(≤32 个)&#10;例如:&#10;100, 101, 102, ...&#10;200, 202, 204, ..."
              class="w-full resize-y rounded-xl border border-slate-800 bg-slate-950/80 p-3 font-mono text-xs leading-5 text-slate-300 placeholder:text-slate-600 focus:border-indigo-500/60 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-300">
              未来协变量 <span class="font-normal text-slate-500">(可选)</span>
            </label>
            <textarea id="input-covariates" rows="3" spellcheck="false"
              placeholder="每行一条协变量,长度 = 上下文长度 + horizon&#10;如周末标记: 0,0,0,0,0,1,1,..."
              class="w-full resize-y rounded-xl border border-slate-800 bg-slate-950/80 p-3 font-mono text-xs leading-5 text-slate-300 placeholder:text-slate-600 focus:border-indigo-500/60 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
          </div>
        </div>

        <!-- 公共参数 -->
        <div class="mt-4 space-y-4">
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label class="text-sm font-medium text-slate-300">预测步长 (horizon)</label>
              <span id="horizon-value" class="rounded-md bg-indigo-500/15 px-2 py-0.5 font-mono text-xs text-indigo-300">24</span>
            </div>
            <input id="input-horizon" type="range" min="1" max="512" value="24" step="1"
              class="w-full accent-indigo-500">
          </div>
          <label class="flex cursor-pointer items-center gap-2.5 text-sm text-slate-300">
            <input id="input-positive" type="checkbox" class="h-4 w-4 rounded border-slate-700 bg-slate-900 accent-indigo-500">
            预测值裁剪为非负 <span class="text-xs text-slate-500">(销量等非负场景)</span>
          </label>
          <button id="btn-forecast" onclick="runForecast()"
            class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-3 text-sm font-semibold text-white shadow-glow transition hover:brightness-110 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50">
            开始预测
          </button>
        </div>
      </div>

      <!-- 模型信息卡 -->
      <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 text-xs backdrop-blur">
        <h3 class="mb-3 text-sm font-medium text-slate-300">模型信息</h3>
        <dl id="model-info" class="grid grid-cols-2 gap-y-2 text-slate-500">
          <dt>加载中...</dt><dd></dd>
        </dl>
        <p class="mt-3 border-t border-slate-800 pt-3 text-slate-600">⚠️ TimesFM 非商业许可证,仅供测试 / 研究使用</p>
      </div>
    </section>

    <!-- 右侧:结果面板 -->
    <section class="space-y-6">
      <!-- 统计卡片 -->
      <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
          <p class="text-xs text-slate-500">推理耗时</p>
          <p id="stat-elapsed" class="mt-1 font-mono text-xl font-semibold text-emerald-400">—</p>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
          <p class="text-xs text-slate-500">推理设备</p>
          <p id="stat-device" class="mt-1 font-mono text-xl font-semibold text-indigo-400">—</p>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
          <p class="text-xs text-slate-500">序列 / 变量数</p>
          <p id="stat-count" class="mt-1 font-mono text-xl font-semibold text-violet-400">—</p>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
          <p class="text-xs text-slate-500">预测步长</p>
          <p id="stat-horizon" class="mt-1 font-mono text-xl font-semibold text-amber-400">—</p>
        </div>
      </div>

      <!-- 图表 -->
      <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 backdrop-blur">
        <div class="mb-3 flex items-center justify-between">
          <h3 class="text-sm font-medium text-slate-300">预测结果</h3>
          <button id="btn-csv" onclick="downloadCsv()" disabled
            class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs text-slate-400 transition hover:border-indigo-500/50 hover:text-indigo-300 disabled:opacity-40">
            ⬇ 导出 CSV
          </button>
        </div>
        <div id="chart" class="h-[420px] w-full"></div>
        <p id="chart-empty" class="py-24 text-center text-sm text-slate-600">输入数据并点击「开始预测」查看结果</p>
      </div>

      <!-- 原始结果 -->
      <details class="rounded-2xl border border-slate-800 bg-slate-900/50 backdrop-blur">
        <summary class="cursor-pointer p-5 text-sm font-medium text-slate-300">预测数值表</summary>
        <div class="max-h-72 overflow-auto px-5 pb-5">
          <table class="w-full text-left font-mono text-xs">
            <thead id="table-head" class="sticky top-0 bg-slate-900 text-slate-400"></thead>
            <tbody id="table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </details>
    </section>
  </div>
</main>

<!-- Toast 提示 -->
<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl border px-4 py-2.5 text-sm shadow-lg"></div>

<script src="/static/app.js"></script>
</body>
</html>
